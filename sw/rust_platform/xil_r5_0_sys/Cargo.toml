[package]
name = "xil-r5-0-sys"
description = "Raw bindings to the psu_cortexr5_0/standalone_psu_cortexr5_0 standalone BSP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Exposes DEP_XIL_R5_0_{BSP_DIR,INCLUDE,LIB_DIR,SPECS,GCC,XILFFS} to dependent build scripts,
# and keeps a binary from linking two BSPs
links = "xil_r5_0"

# no_std: no test/bench harness or doctests on the target (keeps `--all-targets` working)
[lib]
test = false
doctest = false
bench = false

[build-dependencies]
xil-bsp-build.workspace = true
