[package]
name = "xil-a53-amp-sys"
description = "Raw bindings to the psu_cortexa53_1/standalone_a53_amp standalone BSP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Exposes DEP_XIL_A53_AMP_{BSP_DIR,INCLUDE,LIB_DIR,SPECS,GCC,XILFFS} to dependent build scripts,
# and keeps a binary from linking two BSPs
links = "xil_a53_amp"

# no_std: no test/bench harness or doctests on the target (keeps `--all-targets` working)
[lib]
test = false
doctest = false
bench = false

[build-dependencies]
xil-bsp-build.workspace = true
