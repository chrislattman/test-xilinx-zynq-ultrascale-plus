[package]
name = "hello-world-r5-rs"
description = "Cortex-R5#0 application: no_std Rust port of hello_world_r5/src/helloworld_r5.c"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hello-world-r5-rs"
path = "src/main.rs"
# no_std: no test/bench harness on the target (keeps `--all-targets` working)
test = false
bench = false

[dependencies]
xil-r5-0-sys.workspace = true
shared-mem.workspace = true
