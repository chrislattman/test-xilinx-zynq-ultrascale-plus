[package]
name = "hello-world-a53-1-rs"
description = "Cortex-A53#1 application: no_std Rust port of hello_world_a53_1/src/helloworld_a53_1.c"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hello-world-a53-1-rs"
path = "src/main.rs"
# no_std: no test/bench harness on the target (keeps `--all-targets` working)
test = false
bench = false

[dependencies]
xil-a53-amp-sys.workspace = true
shared-mem.workspace = true
